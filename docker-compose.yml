# Docker Compose configuration for the application stack
#version: '3.8'

services:

  ######################################################
  #                  FRONTEND OPEN WEB UI              #
  ######################################################
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    environment:
      - 'OLLAMA_BASE_URL=http://orchestrator:8000'
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - query_network
    ports:
      - "8080:8080"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - orchestrator

  ######################################################
  #                   ORCHESTRATOR LLM                 #
  ######################################################
  orchestrator:
    build: ./orchestrateur
    container_name: orchestrator
    restart: always
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      MCP_GATEWAY_URL: ws://mcp-gateway:9000
      OPENROUTER_MODEL: qwen/qwen3.5-9b
    networks:
      - query_network
      - bdd_network
  
  query-management:
    build: ./query-management
    container_name: query-management
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "220:220"
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
    depends_on:
      - orchestrator
    networks:
      - query_network
  
  ######################################################
  #                     MCP GATEWAY                    #
  ######################################################
  mcp-gateway:
    build: ./mcp/mcp-gateway
    container_name: mcp-gateway
    restart: always
    ports:
      - "9000:9000"
    networks:
      - query_network
      - bdd_network
    depends_on:
      mcp-postgres:
        condition: service_healthy
      mcp-mongo:
        condition: service_healthy
      mcp-mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy

  ######################################################
  #                SERVEURS MCP (DB CONNECTORS)        #
  ######################################################
  # Postgres MCP Server (CrystalDBA Pro)
  mcp-postgres:
    image: crystaldba/postgres-mcp
    container_name: mcp-postgres
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command:
      - "--access-mode=unrestricted"
      - "--transport=sse"
      - "--sse-host=0.0.0.0"
      - "--sse-port=8000"
    ports:
      - "8002:8000"
    networks:
      - bdd_network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8000)); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  mcp-mongo:
    image: node:20-alpine
    container_name: mcp-mongo
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      # URI correspondant à ton service 'mongo' défini plus bas
      - MONGO_URI=mongodb://root:example@mongo:27017/?authSource=admin
    # On utilise supergateway pour convertir le serveur officiel (stdio) en serveur SSE sur le port 8003
    command: >
      sh -c "npm install -g supergateway mongodb-mcp-server &&
      supergateway --port 8003 --stdio 'npx mongodb-mcp-server $$MONGO_URI'"
    ports:
      - "8003:8003"
    networks:
      - bdd_network
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').createConnection({port:8003,host:'localhost',timeout:2000});s.on('connect',()=>{s.destroy();process.exit(0)});s.on('error',()=>process.exit(1));s.on('timeout',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
  ######################################################
  #                   POSTGRES-PGVECTOR                #
  ######################################################
  postgres-pgvector:
    build:
      context: ./DataBase/postgres-pgvector
    container_name: postgres-pgvector
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata_pgvector:/var/lib/postgresql/data
      - ./DataBase/postgres-pgvector/dataset_droit_travail.sql:/docker-entrypoint-initdb.d/03-droit-travail-data.sql
    ports:
      - "5433:5432"
    networks:
      - bdd_network

  ######################################################
  #                       MYSQL                        #
  ######################################################
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./DataBase/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    networks:
      - bdd_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mcp-mysql:
    image: node:20-alpine
    container_name: mcp-mysql
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASS=${MYSQL_PASSWORD}
      - MYSQL_DB=${MYSQL_DATABASE}
      - ALLOW_INSERT_OPERATION=true
      - ALLOW_UPDATE_OPERATION=true
      - ALLOW_DELETE_OPERATION=false
    command: >
      sh -c "npm install -g supergateway @benborla29/mcp-server-mysql &&
      supergateway --port 8004 --stdio 'npx @benborla29/mcp-server-mysql'"
    ports:
      - "8004:8004"
    networks:
      - bdd_network
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').createConnection({port:8004,host:'localhost',timeout:2000});s.on('connect',()=>{s.destroy();process.exit(0)});s.on('error',()=>process.exit(1));s.on('timeout',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s

  ######################################################
  #                BASES DE DONNÉES RÉELLES            #
  ######################################################
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./DataBase/postgres:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    networks:
      - bdd_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  ######################################################
  # SEEDER (génère les données au premier lancement) #
  ######################################################

  ######################################################
  #                      MONGODB                      #
  ######################################################
  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: safety_db
    volumes:
      - mongo_data:/data/db
      - ./DataBase/mongo/mongo-init:/docker-entrypoint-initdb.d
    ports:
      - "27017:27017"
    networks:
      - bdd_network

  ######################################################
  #                  MONGO DATA LOADER                 #
  ######################################################
  mongo-loader:
    build:
      context: ./DataBase/mongo/mongo-loader
    container_name: mongo-loader
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://root:example@mongo:27017
      MONGO_DB: animaux_db
      MONGO_COLLECTION: animaux
    networks:
      - bdd_network
    restart: 'no'

########################################################
#                       RÉSEAUX                         #
########################################################
networks:
  query_network:
    driver: bridge
  bdd_network:
    driver: bridge

########################################################
#                      VOLUMES                          #
########################################################
volumes:
  postgres_data:
  mongo_data:
  mysql_data:
  pgdata_pgvector:
    driver: local
  open-webui-data:
    driver: local
